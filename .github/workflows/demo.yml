name: demo

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fpvtop
        run: python -m pip install .
      - name: Record demo
        uses: charmbracelet/vhs-action@v2
        with:
          path: packaging/vhs/demo.tape
      - name: Commit demo gif
        run: |
          git config user.name kirarahoshiiii
          git config user.email 299474069+kirarahoshiiii@users.noreply.github.com
          git add assets/demo.gif
          git diff --cached --quiet || git commit -m "Re-record demo gif"
          git pull --rebase
          git push
